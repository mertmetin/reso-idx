name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3', '8.4' ]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php: ${{ matrix.php }}
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: vendor/bin/phpunit

  lint:
    name: Coding standards and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php: '8.3'
          coverage: none
          tools: cs2pr
      - uses: ramsey/composer-install@v3
      - name: PHPCS (WordPress coding standards)
        run: vendor/bin/phpcs -q --report=checkstyle | cs2pr
      - name: PHPStan (level 6)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G --error-format=github
      - name: Demo data is up to date
        run: |
          php bin/generate-demo-data.php
          git diff --exit-code data/demo-listings.json

  e2e:
    name: WordPress smoke test (Playground)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: tests/e2e/smoke.sh
